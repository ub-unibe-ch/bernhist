name: "Build"

on:
    pull_request: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    phpstan:
        name: "pstan"
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout"
              uses: "actions/checkout@v4"

            - name: "Install PHP"
              uses: "shivammathur/setup-php@v2"
              with:
                  coverage: "none"
                  php-version: "8.4"
                  extensions: "intl, json, zip"

            - name: Get composer cache directory
              id: composerCache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composerCache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: "Configure Composer token"
              run: composer config -g github-oauth.github.com ${{ secrets.PACKAGIST_TOKEN }}

            - name: "Install latest dependencies"
              run: composer install --ansi --no-interaction --no-progress --prefer-dist

            - name: "Run phpstan"
              run: php vendor/bin/phpstan analyse --error-format=github

    php-cs-fixer:
        name: "php-cs-fixer"
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout"
              uses: "actions/checkout@v4"

            - name: "Install PHP"
              uses: "shivammathur/setup-php@v2"
              with:
                  coverage: "none"
                  php-version: "8.4"
                  extensions: "intl, json, zip"

            - name: Get composer cache directory
              id: composerCache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composerCache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: "Configure Composer token"
              run: composer config -g github-oauth.github.com ${{ secrets.PACKAGIST_TOKEN }}

            - name: "Install latest dependencies"
              run: composer install --ansi --no-interaction --no-progress --prefer-dist

            - name: "Run php-cs-fixer"
              run: php vendor/bin/php-cs-fixer fix -v --dry-run --using-cache=no

    phpunit:
        name: "phpunit"
        needs: [ "phpstan", "php-cs-fixer" ]
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout"
              uses: "actions/checkout@v4"

            - name: "Install PHP"
              uses: "shivammathur/setup-php@v2"
              with:
                  coverage: "pcov"
                  php-version: "8.4"
                  extensions: "intl, json, zip"

            - name: "Install symfony-cli"
              run: |
                  curl -sS https://get.symfony.com/cli/installer | bash
                  mv $HOME/.symfony5/bin/symfony /usr/local/bin/symfony

            - name: Get composer cache directory
              id: composerCache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composerCache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: "Configure Composer token"
              run: composer config -g github-oauth.github.com ${{ secrets.PACKAGIST_TOKEN }}

            - name: "Install latest dependencies"
              run: composer install --ansi --no-interaction --no-progress --prefer-dist

            - name: "Build assets"
              run: |
                  php bin/console sass:build
                  php bin/console asset-map:compile

            - name: "Start services"
              run: docker compose up -d --wait

            - name: "Run PHPUnit"
              run: symfony php vendor/bin/phpunit

            - name: "Cleanup"
              if: ${{ always() }}
              run: docker compose down
